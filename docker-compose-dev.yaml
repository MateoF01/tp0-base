      - CLI_NUMERO=5678
    volumes:
      - ./client/config.yaml:/config.yaml:ro
    networks:
      - testing_net
    depends_on:
      - server

  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - CLI_NOMBRE=Lucía
      - CLI_APELLIDO=Martínez
      - CLI_DOCUMENTO=40123456
